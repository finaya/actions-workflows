name: Build and tests

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner: string ou JSON array, ex.: ["self-hosted","linux","arm64","finaya-shared"]'
        type: string
        required: false
        default: '"ubuntu-latest"'
    secrets:
      actor:
        required: true
      actor-access-token:
        required: true
      sonar-access-token:
        required: false

env:
  maven-repo: |
    [
      {
        "id": "github",
        "url": "https://maven.pkg.github.com/finaya/*",
        "snapshots": {
          "enabled": "true"
        }
      }
    ]
  maven-server: |
    [
      {
        "id": "github",
        "username": "${{ secrets.actor }}",
        "password": "${{ secrets.actor-access-token }}"
      }
    ]

jobs:
  sonar:
    name: SonarQube
    runs-on: ${{ fromJSON(inputs.runs-on) }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@v2

      - name: Set up JDK
        uses: actions/setup-java@v1
        with:
          java-version: ${{ inputs.java-version }}

      - name: "Create settings.xml"
        uses: whelk-io/maven-settings-xml-action@v16
        with:
          repositories: ${{ env.maven-repo }}
          servers: ${{ env.maven-server }}

      - name: Cache SonarQube packages
        uses: actions/cache@v1
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v1
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: "Create settings.xml"
        uses: whelk-io/maven-settings-xml-action@v16
        with:
          repositories: ${{ env.maven-repo }}
          servers: ${{ env.maven-server }}

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.actor-access-token }}
          SONAR_TOKEN: ${{ secrets.sonar-access-token }}
          SONAR_HOST_URL: https://sonarqube.buildersbank.io/
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar