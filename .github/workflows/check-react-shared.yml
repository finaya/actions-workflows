name: Check React Shared

on:
  workflow_call:
    secrets:
      PACKAGES_NPMRC:
        description: 'Token of the Builders Github Packages'
        required: false
    inputs:
      IS_REQUIRED_SET_PACKAGES_NPMRC:
        type: string
        description: 'Is required set on .npmrc the PACKAGES_NPMRC'
        required: false
        default: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      - name: Set NPM Variables
        run: |
          printf '@finaya:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\nalways-auth=true\n' "$NPM_TOKEN" > .npmrc
          # registries extras do segredo (ex: @fortawesome), sem sobrescrever o do GitHub Packages
          [ -n "$PACKAGES_NPMRC" ] && printf '%s\n' "$PACKAGES_NPMRC" | grep -v 'npm.pkg.github.com' >> .npmrc || true
        env:
          NPM_TOKEN: ${{ github.token }}
          PACKAGES_NPMRC: ${{ secrets.PACKAGES_NPMRC }}
      - name: Install packages
        run: yarn install
      # - name: Tests
      #   run: yarn test
      - name: Linter
        run: yarn lint
